name: Build debug APK

# Personal build of the fork (Perfect Music): no Telegram, no release keystore needed.
# The APK is signed with a fixed key stored in the GitHub Secrets PERSONAL_KEYSTORE_BASE64 and
# PERSONAL_KEYSTORE_PASSWORD, so the signature never changes and updates install over the old app.
# Without those secrets it falls back to the debug key kept in the Actions cache. It installs as a separate app (package ends
# with ".music"), next to the original ArchiveTune.
# Every build is also attached, as a plain .apk (no zip), to the "latest" release.
# It is the optimized build (faster to open); the debug build is only a fallback if R8 fails.

on:
  workflow_dispatch:
  push:
    branches: [ 'widgets-novos' ]

permissions:
  contents: write

concurrency:
  group: debug-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build gms-mobile-arm64 debug
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Python 3
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Generate translation contributor credits
        run: python scripts/generate_translation_contributors.py

      - name: Set up JDK 27
        uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: personal-signing-key-v1

      - name: Prepare fixed signing key
        env:
          KEYSTORE_B64: ${{ secrets.PERSONAL_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.PERSONAL_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/perfect-music.keystore"
            {
              echo "PERSONAL_KEYSTORE_FILE=$RUNNER_TEMP/perfect-music.keystore"
              echo "PERSONAL_STORE_PASSWORD=$KEYSTORE_PASS"
              echo "PERSONAL_KEY_PASSWORD=$KEYSTORE_PASS"
              echo "PERSONAL_KEY_ALIAS=perfectmusic"
            } >> "$GITHUB_ENV"
            echo "Using the fixed Perfect Music signing key."
          else
            echo "::warning::Secrets PERSONAL_KEYSTORE_BASE64/PERSONAL_KEYSTORE_PASSWORD not set; using the cached debug key."
          fi

      - name: Compute version
        id: version
        run: |
          BASE=$(sed -n 's/.*versionName = "\([0-9][0-9.]*\)".*/\1/p' app/build.gradle.kts | head -n 1)
          echo "name=${BASE}-p.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build optimized APK
        id: personal
        # Optimized (R8) build, same app name and icon as before. If R8 breaks, the debug build below
        # is used instead so there is always one APK.
        continue-on-error: true
        run: ./gradlew assembleGmsMobileArm64Personal -PnightlyVersionName=${{ steps.version.outputs.name }} -PbuildNumber=${{ github.run_number }} --stacktrace

      - name: Build debug APK (fallback)
        if: steps.personal.outcome == 'failure'
        run: ./gradlew assembleGmsMobileArm64Debug -PnightlyVersionName=${{ steps.version.outputs.name }} -PbuildNumber=${{ github.run_number }} --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: archivetune-debug-arm64
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Publish APK to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest \
            --prerelease --title "Última build" --notes "Build automática da branch widgets-novos." \
            --target "$GITHUB_SHA"
          APK=$(find app/build/outputs/apk -name '*.apk' | head -n 1)
          gh release upload latest "$APK" --clobber
          # Keep a single APK on the release: drop the one from the other build type.
          case "$APK" in
            *personal*) gh release delete-asset latest app-gms-mobile-arm64-debug.apk --yes || true ;;
            *debug*) gh release delete-asset latest app-gms-mobile-arm64-personal.apk --yes || true ;;
          esac
          echo "APK: https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/$(basename "$APK")"

          # Versioned release: the app's own updater reads these to find the newest build.
          case "$APK" in
            *personal*)
              TAG="v${{ steps.version.outputs.name }}"
              gh release create "$TAG" "$APK" --target "$GITHUB_SHA" \
                --title "Perfect Music $TAG" \
                --notes "$(git log -1 --pretty=%s)" || true
              # Keep only the 5 newest versioned releases.
              gh release list --limit 100 --json tagName,createdAt \
                --jq '[.[] | select(.tagName | test("-p\\.[0-9]+$"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
                | while read -r old; do gh release delete "$old" --yes --cleanup-tag || true; done
              ;;
          esac
